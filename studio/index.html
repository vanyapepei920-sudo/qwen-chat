<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syntheco Studio — конструктор сайтов</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .studio{display:grid;grid-template-columns:280px 1fr;gap:14px;height:calc(100vh - 120px)}
  textarea.editor{height:100%;width:100%}
  iframe.preview{width:100%;height:100%;border:1px solid var(--border);border-radius:12px;background:#fff}
  @media(max-width:760px){.studio{grid-template-columns:1fr;height:auto}.editor,.preview{height:40vh}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">S</span> Studio</div>
  <nav class="tabs"><button class="active">✍️ Редактор</button></nav>
  <div class="userbox"><a class="btn ghost sm" href="../">← Экосистема</a></div>
</header>
<main>
  <div class="studio">
    <div class="col">
      <h2>HTML-код сайта</h2>
      <textarea id="code" class="code editor" spellcheck="false"></textarea>
    </div>
    <div class="col">
      <div class="row" style="margin-bottom:8px">
        <button class="btn primary" onclick="renderPreview()">▶ Обновить превью</button>
        <input id="siteName" class="input grow" placeholder="имя сайта (my-site)">
        <button class="btn" onclick="publishSite()">🚀 Опубликовать на GitHub Pages</button>
      </div>
      <iframe id="pv" class="preview"></iframe>
    </div>
  </div>
</main>
<div id="toasts"></div>
<script src="../js/utils.js"></script>
<script>
const START = `<!DOCTYPE html>\n<html lang="ru">\n<head>\n<meta charset="utf-8">\n<title>Мой сайт</title>\n<style>body{font-family:sans-serif;background:#0d1117;color:#e6edf3;display:grid;place-items:center;height:100vh;margin:0}\nh1{font-size:40px;background:linear-gradient(90deg,#2f81f7,#a371f7);-webkit-background-clip:text;color:transparent}</style>\n</head>\n<body><div><h1>Привет, мир!</h1><p>Мой первый сайт на GitHub Pages.</p></div></body>\n</html>`;
document.getElementById('code').value = localStorage.getItem('syntheco_site') || START;
function renderPreview() {
  localStorage.setItem('syntheco_site', document.getElementById('code').value);
  document.getElementById('pv').srcdoc = document.getElementById('code').value;
}
async function publishSite() {
  if (!getToken()) return toast('Сначала сохраните GitHub-ключ в Экосистеме (⚙ Настройки)', false);
  const name = (document.getElementById('siteName').value.trim() || 'my-site').toLowerCase().replace(/[^a-z0-9_-]/g, '-');
  try {
    let me = await gh('/user');
    try { await gh(`/repos/${me.login}/${name}`); }
    catch (e) { await gh('/user/repos', { method:'POST', body:{ name, auto_init:true, description:'Syntheco Studio site' } }); }
    let sha = null;
    try { sha = (await gh(`/repos/${me.login}/${name}/contents/index.html`)).sha; } catch (e) {}
    const b64 = btoa(unescape(encodeURIComponent(document.getElementById('code').value)));
    await gh(`/repos/${me.login}/${name}/contents/index.html`, { method:'PUT', body:{ message:'Studio publish', content:b64, sha } });
    try { await gh(`/repos/${me.login}/${name}/contents/.nojekyll`, { method:'PUT', body:{ message:'nojekyll', content:'' } }); } catch (e) {}
    try { await gh(`/repos/${me.login}/${name}/pages`, { method:'POST', body:{ source:{ branch:'main', path:'/' } } }); }
    catch (e) { await gh(`/repos/${me.login}/${name}/pages`, { method:'PUT', body:{ source:{ branch:'main', path:'/' } } }); }
    const url = `https://${me.login}.github.io/${name}/`;
    toast('Опубликовано! Через ~минуту: ' + url);
    window.open(url, '_blank');
  } catch (e) { toast('Ошибка: ' + e.message, false); }
}
renderPreview();
</script>
</body>
</html>
