{% extends "base.html" %}
{% block title %}История — NetPulse{% endblock %}
{% block content %}
<div class="container"><div class="grid">
  <section class="card glass col-12">
    <div class="card-h"><h3>Тренды измерений</h3><div class="spacer"></div>
      <span class="tag" id="hCount">0 записей</span>
      <button class="btn sm ghost" id="hExport">⇩ Экспорт JSON</button>
      <button class="btn sm ghost danger" id="hClear">Очистить</button></div>
    <div class="chart-box"><canvas id="hChart"></canvas></div>
    <div class="chart-legend"><span><i style="background:#00e5ff"></i>Загрузка</span><span><i style="background:#3ddc97"></i>Отдача</span><span><i style="background:#c9b6ff"></i>Пинг (÷10)</span></div>
  </section>
  <section class="card glass col-12">
    <div class="card-h"><h3>Все записи</h3></div>
    <div class="tbl-wrap"><table><thead><tr><th>Дата</th><th>Тип</th><th>↓</th><th>↑</th><th>Пинг</th><th>Джиттер</th><th>Потери</th><th>Оценка</th></tr></thead><tbody id="hBody"><tr><td colspan="8" class="empty">Загрузка…</td></tr></tbody></table></div>
  </section>
</div></div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/misc.js') }}"></script>{% endblock %}
