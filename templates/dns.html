{% extends "base.html" %}
{% block title %}DNS — NetPulse{% endblock %}
{% block content %}
<div class="container"><div class="grid">
  <section class="card glass col-12">
    <div class="card-h"><h3>Проверка DNS (DoH)</h3><div class="spacer"></div>
      <input id="dnsHost" class="inp" value="example.com" placeholder="домен">
      <button class="btn sm primary" id="dnsRun">▶ Проверить</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Провайдер</th><th>IP‑адреса</th><th>CNAME</th><th>Время</th><th>Статус</th></tr></thead><tbody id="dnsBody"><tr><td colspan="5" class="empty">Введите домен и нажмите «Проверить»</td></tr></tbody></table></div>
    <div class="card-h" style="margin-top:22px"><h3>Скорость разрешения (ping‑тест провайдеров)</h3></div>
    <div class="stats" id="dnsStats"></div>
  </section>
</div></div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/nettools.js') }}"></script>{% endblock %}
