<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}NetPulse{% endblock %}</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/cyrillic-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/cyrillic-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/cyrillic-800-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/jetbrains-mono@latest/cyrillic-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/jetbrains-mono@latest/cyrillic-700-normal.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-page="{{ page|default('') }}">
<div class="bgfx"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div><div class="grid"></div></div>

{% if user %}
<nav class="topnav glass">
  <a class="brand" href="{{ url_for('dashboard') }}">
    <span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M2 12h4l2.5-7 4 14L15 12h7" stroke="#06101c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="brand-name">Net<span>Pulse</span></span>
  </a>
  <div class="tabs" id="tabs">
    <a href="{{ url_for('dashboard') }}"  data-tab="dashboard">⚡ Спидтест</a>
    <a href="{{ url_for('ping') }}"       data-tab="ping">◷ Пинг</a>
    <a href="{{ url_for('traceroute') }}" data-tab="traceroute">⇢ Трассировка</a>
    <a href="{{ url_for('dns') }}"        data-tab="dns">🌐 DNS</a>
    <a href="{{ url_for('wifi') }}"       data-tab="wifi">📶 Wi‑Fi</a>
    <a href="{{ url_for('search') }}"     data-tab="search">🔎 Поиск</a>
    <a href="{{ url_for('history') }}"    data-tab="history">🗂 История</a>
    <a href="{{ url_for('settings') }}"   data-tab="settings">⚙ Настройки</a>
    <a href="{{ url_for('about') }}"      data-tab="about">ℹ О проекте</a>
  </div>
  <div class="topnav-right">
    <div class="status-pill" id="netStatus"><span class="dot on"></span><span id="netStatusTxt">онлайн</span></div>
    <div class="user-chip"><div id="avatarBox"></div>
      <div><div class="nm" id="userName">{{ user.name }}</div><div class="em" id="userMail">{{ user.email }}</div></div></div>
    <button class="btn sm ghost danger" id="signOutBtn">Выйти</button>
  </div>
</nav>
{% endif %}

{% block content %}{% endblock %}

<div class="qw-pill" id="qwPill" role="status" aria-live="polite">
  <div class="qw-mark"><div class="ring"></div><div class="core"></div></div>
  <div class="qw-txt"><b id="qwTitle">Выполняется…</b><small id="qwSub">подготовка</small>
    <div class="qw-bars"><i class="qw-shimmer"></i><i class="qw-shimmer"></i><i class="qw-shimmer"></i></div></div>
</div>
<div id="toasts"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>window.NP = { clientId:"{{ google_client_id|default('') }}", page:"{{ page|default('') }}", user:{{ user|tojson if user else 'null' }} };</script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
