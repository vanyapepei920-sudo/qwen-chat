<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>{% block title %}Scuarfy Store{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="{{ url_for('static', filename='css/scuarfy.css') }}">
</head>
<body data-page="{{ page|default('') }}">

{% if user %}
<header class="ms-top">
  <a class="ms-brand" href="{{ url_for('store') }}">
    <span class="ms-logo">S</span>
    <span>Scuarfy&nbsp;<b style="color:var(--brand)">Store</b></span>
  </a>
  <form class="ms-search" id="globalSearch" action="{{ url_for('store') }}" method="get">
    <span class="ic">🔎</span>
    <input id="gq" name="q" placeholder="Поиск приложений в Scuarfy Store…" autocomplete="off"
           value="{{ request.args.get('q','') }}">
    <button type="button" class="clr" id="gqClr" title="Очистить">✕</button>
  </form>
  <div class="ms-right">
    <div class="ms-user">
      <div class="ms-avatar">{% if user.picture %}<img src="{{ user.picture }}" referrerpolicy="no-referrer" alt="">{% else %}{{ (user.name or 'Я')[:1]|upper }}{% endif %}</div>
      <div><div style="font-weight:600;color:var(--ink);font-size:13px">{{ user.name }}</div>
           <div style="font-size:11.5px">{{ user.email }}</div></div>
    </div>
    <button class="btn sm" id="signOutBtn">Выйти</button>
  </div>
</header>
<nav class="ms-nav">
  <a href="{{ url_for('store') }}" data-tab="store" class="{{ 'on' if page=='store' }}">🛍 Магазин</a>
  <a href="{{ url_for('store') }}#cats" data-tab="cats">🗂 Категории</a>
  <a href="{{ url_for('store') }}#recs" data-tab="recs">✨ Рекомендации</a>
  <a href="{{ url_for('store') }}?sort=new" data-tab="new">🆕 Новинки</a>
</nav>
{% endif %}

{% block content %}{% endblock %}

<div id="toasts"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>window.SF = { clientId:"{{ google_client_id|default('') }}", page:"{{ page|default('') }}", user:{{ user|tojson if user else 'null' }} };</script>
<script src="{{ url_for('static', filename='js/global.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
