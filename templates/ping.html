{% extends "base.html" %}
{% block title %}Пинг — NetPulse{% endblock %}
{% block content %}
<div class="container"><div class="grid">
  <section class="card glass col-8">
    <div class="card-h"><h3>Непрерывный пинг</h3><div class="spacer"></div>
      <select id="pingTarget" class="sel"><option value="cloudflare">Cloudflare (1.1.1.1)</option><option value="google">Google (8.8.8.8)</option><option value="yandex">Яндекс</option><option value="cloudflare-speed">CF Speed</option></select>
      <button class="btn sm primary" id="pingStart">▶ Старт</button>
      <button class="btn sm" id="pingStop" disabled>■ Стоп</button></div>
    <div class="chart-box tall"><canvas id="pingChart"></canvas></div>
    <div class="chart-legend"><span><i style="background:#00e5ff"></i>RTT, мс</span><span><i style="background:#ffbe4d"></i>Среднее</span><span><i style="background:#ff5f7e"></i>Потери</span></div>
  </section>
  <section class="card glass col-4">
    <div class="card-h"><h3>Статистика</h3></div>
    <div class="stats single">
      <div class="stat ping"><div class="k">Текущий</div><div class="v" id="pCur">—<span class="u">мс</span></div></div>
      <div class="stat"><div class="k">Минимум</div><div class="v" id="pMin">—<span class="u">мс</span></div></div>
      <div class="stat"><div class="k">Максимум</div><div class="v" id="pMax">—<span class="u">мс</span></div></div>
      <div class="stat"><div class="k">Среднее</div><div class="v" id="pAvg">—<span class="u">мс</span></div></div>
      <div class="stat"><div class="k">Джиттер</div><div class="v" id="pJit">—<span class="u">мс</span></div></div>
      <div class="stat loss"><div class="k">Потери</div><div class="v" id="pLoss">—<span class="u">%</span></div></div>
      <div class="stat"><div class="k">Отправлено</div><div class="v" id="pSent">0</div></div>
      <div class="stat"><div class="k">Время</div><div class="v" id="pTime">0<span class="u">с</span></div></div>
    </div>
  </section>
</div></div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/ping.js') }}"></script>{% endblock %}
