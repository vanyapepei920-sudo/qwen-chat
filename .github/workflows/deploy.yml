name: Deploy NetPulse to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL не задан — публикация через GitHub Pages для Flask-сервера недоступна."
            echo "Зайдите в Settings -> Secrets -> Actions и добавьте RENDER_DEPLOY_HOOK_URL из Render.com (New Web Service -> ваш репозиторий)."
            exit 1
          fi
          curl -fsSL "$HOOK_URL"
